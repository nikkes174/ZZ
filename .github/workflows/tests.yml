name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+asyncpg://test:test@localhost:5432/test
      API_IIKO: test
      IIKO_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000001
      TERMINAL_ID_GROUP_MALYSHAVA: 00000000-0000-0000-0000-000000000002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile
        run: uv run python -m compileall backend main.py

      - name: Tests
        run: uv run pytest -q
